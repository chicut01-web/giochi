<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Felt Gradient -->
    <radialGradient id="feltBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#14462c"/>
      <stop offset="60%" stop-color="#092819"/>
      <stop offset="100%" stop-color="#04140b"/>
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="25%" stop-color="#ffd24d"/>
      <stop offset="50%" stop-color="#b8860b"/>
      <stop offset="75%" stop-color="#ffd24d"/>
      <stop offset="100%" stop-color="#7a5500"/>
    </linearGradient>

    <linearGradient id="goldShine" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="80%" stop-color="#b38600"/>
      <stop offset="100%" stop-color="#805d00"/>
    </linearGradient>

    <linearGradient id="coinFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="35%" stop-color="#f5c542"/>
      <stop offset="70%" stop-color="#d49b14"/>
      <stop offset="100%" stop-color="#8f5b04"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c542" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#d49b14" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b8860b" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="goldDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full bleed Background for Maskable & Standalone -->
  <rect width="512" height="512" fill="url(#feltBg)"/>

  <!-- Subtle Diamond Weave Pattern in Background -->
  <g stroke="#f5c542" stroke-opacity="0.04" stroke-width="1.5" fill="none">
    <path d="M0 64 L512 64 M0 128 L512 128 M0 192 L512 192 M0 256 L512 256 M0 320 L512 320 M0 384 L512 384 M0 448 L512 448"/>
    <path d="M64 0 L64 512 M128 0 L128 512 M192 0 L192 512 M256 0 L256 512 M320 0 L320 512 M384 0 L384 512 M448 0 L448 512"/>
    <path d="M0 0 L512 512 M512 0 L0 512"/>
  </g>

  <!-- Ambient Golden Center Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#sunGlow)"/>

  <!-- Outer Golden Luxury Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldRim)" stroke-width="4" filter="url(#goldDropShadow)"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="#f5c542" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Main Medallion Body: Il Settebello / Il Sole di Denari -->
  <g filter="url(#goldDropShadow)">
    <!-- Medallion Rim -->
    <circle cx="256" cy="256" r="148" fill="url(#goldRim)"/>
    <!-- Medallion Bevel -->
    <circle cx="256" cy="256" r="142" fill="#8f5b04"/>
    <!-- Medallion Face -->
    <circle cx="256" cy="256" r="138" fill="url(#coinFace)"/>
  </g>

  <!-- Solar Rays on the Coin (Classic Italian Denari Sunburst) -->
  <g fill="url(#goldRim)" opacity="0.85">
    <!-- 8 Main Sharp Beveled Rays -->
    <polygon points="256,128 263,170 256,164 249,170"/>
    <polygon points="256,384 263,342 256,348 249,342"/>
    <polygon points="128,256 170,263 164,256 170,249"/>
    <polygon points="384,256 342,263 348,256 342,249"/>
    
    <!-- 4 Diagonal Rays -->
    <polygon points="166,166 202,188 194,194 188,202"/>
    <polygon points="346,346 310,324 318,318 324,310"/>
    <polygon points="346,166 324,202 318,194 310,188"/>
    <polygon points="166,346 188,310 194,318 202,324"/>
  </g>

  <!-- Inner Concentric Ring of the Coin -->
  <circle cx="256" cy="256" r="76" fill="#1b462c" stroke="url(#goldRim)" stroke-width="4"/>

  <!-- The Central Iconic Settebello '7' & Crown Emblem -->
  <!-- Crown on Top of 7 -->
  <path d="M236 218 L244 225 L256 212 L268 225 L276 218 L273 234 L239 234 Z" fill="url(#goldRim)" filter="url(#softGlow)"/>
  <circle cx="236" cy="216" r="2.5" fill="#ffffff"/>
  <circle cx="256" cy="210" r="3.5" fill="#ffffff"/>
  <circle cx="276" cy="216" r="2.5" fill="#ffffff"/>

  <!-- Sculpted Number 7 -->
  <text x="256" y="286" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="64" font-weight="900" fill="url(#goldRim)" text-anchor="middle" letter-spacing="1">7</text>

  <!-- 4 Italian Suit Accents at the Cardinal Points -->
  <!-- Top: Coppa (Chalice) -->
  <g transform="translate(256, 44) scale(0.65)" filter="url(#goldDropShadow)">
    <path d="M-18 -20 L18 -20 C18 0 10 16 3 20 L3 30 L12 34 L12 38 L-12 38 L-12 34 L-3 30 L-3 20 C-10 16 -18 0 -18 -20 Z" fill="url(#goldRim)"/>
  </g>

  <!-- Bottom: Bastone (Ceremonial Baton) -->
  <g transform="translate(256, 468) scale(0.65)" filter="url(#goldDropShadow)">
    <rect x="-4" y="-22" width="8" height="44" rx="3" fill="url(#goldRim)"/>
    <circle cx="0" cy="-22" r="7" fill="url(#goldRim)"/>
    <circle cx="0" cy="22" r="7" fill="url(#goldRim)"/>
    <circle cx="0" cy="0" r="5" fill="#123a23"/>
  </g>

  <!-- Left: Spada (Scimitar / Italian Sword) -->
  <g transform="translate(44, 256) scale(0.65)" filter="url(#goldDropShadow)">
    <path d="M22 0 C10 -6 0 -15 -18 -24 C-14 -12 -10 12 -18 24 C0 15 10 6 22 0 Z" fill="url(#goldRim)"/>
    <circle cx="-20" cy="0" r="4" fill="url(#goldRim)"/>
  </g>

  <!-- Right: Denaro (Golden Coin Pip) -->
  <g transform="translate(468, 256) scale(0.65)" filter="url(#goldDropShadow)">
    <circle cx="0" cy="0" r="20" fill="url(#goldRim)"/>
    <circle cx="0" cy="0" r="14" fill="#0b2c1b" stroke="url(#goldRim)" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="url(#goldRim)"/>
  </g>

  <!-- Glass Specular Reflection Highlight Across Top Half -->
  <path d="M30 180 C120 70 392 70 482 180 C440 100 350 40 256 40 C162 40 72 100 30 180 Z" fill="#ffffff" opacity="0.08"/>
</svg>
